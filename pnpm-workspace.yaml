packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/build-output-utils@0.8.4'
  - '@cloudflare/codemods@0.3.0'
  - '@cloudflare/config@0.22.0'
  - '@cloudflare/runtime-types@0.1.6'
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - cf@1.0.0-beta.7
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0
# miniflare 4 (via @cloudflare/vitest-pool-workers 0.18 and wrangler) pins
# sharp 0.34.5 and undici 7.28.0, both with published advisories, and no
# stable miniflare 4 release moves past them. Test/local runtime only; never
# bundled into a Worker. Remove once pool-workers and wrangler depend on a
# miniflare that already ships these versions.
overrides:
  "miniflare>sharp": "^0.35.4"
  "miniflare>undici": "^7.29.0"
  # apps/admin takes inquiry-platform's core from its release tag. Core's
  # `workspace:*` dependency on the SDK only resolves inside that repository,
  # and a git-hosted subdependency is blocked here, so it is dropped and
  # apps/admin aliases `@inquiry-platform/sdk` to its own direct dependency.
  "@inquiry-platform/core>@inquiry-platform/sdk": "-"
