name: Deploy admin-core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin-core/**'
      - 'packages/admin-contracts/**'
      - 'packages/admin-mail/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read

concurrency:
  group: deploy-admin-core
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Same gate as every other deploy here: nothing runs until the Cloudflare
    # side exists. Admin Core must be deployed before the Workers that bind to
    # it — see the deployment order in apps/admin-core/README.md.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.ADMIN_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-core
          command: deploy
