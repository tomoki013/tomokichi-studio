name: Preview app sites

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'packages/app-site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: app-site-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Cloudflare previews
    runs-on: ubuntu-latest
    # Reuse the same Cloudflare credentials as production deployments. This job
    # only uploads Worker versions; it never deploys them to production traffic.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find affected app sites
        id: sites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const appsDir = path.join(process.cwd(), 'apps');
          const excluded = new Set(['api', 'main']);
          const appSites = fs.readdirSync(appsDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .filter((name) => !excluded.has(name))
            .filter((name) => {
              const dir = path.join(appsDir, name);
              const packagePath = path.join(dir, 'package.json');
              const wranglerPath = path.join(dir, 'wrangler.jsonc');
              if (!fs.existsSync(packagePath) || !fs.existsSync(wranglerPath)) return false;
              const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
              return Boolean(pkg.dependencies?.['@tomokichi/app-site']);
            })
            .sort();

          const changed = execFileSync(
            'git',
            ['diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA],
            { encoding: 'utf8' },
          ).trim().split('\n').filter(Boolean);

          const sharedChanged = changed.some((file) =>
            file.startsWith('packages/app-site/') ||
            ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json'].includes(file),
          );

          const affected = sharedChanged
            ? appSites
            : appSites.filter((name) => changed.some((file) => file.startsWith(`apps/${name}/`)));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sites=${affected.join(' ')}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### App-site previews\n\nAffected sites: ${affected.join(', ') || 'none'}\n`);
          NODE

      - name: Build and upload preview versions
        if: steps.sites.outputs.sites != ''
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          SITES: ${{ steps.sites.outputs.sites }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Cloudflare preview credentials are not configured." >&2
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production GitHub Environment (or repository Actions secrets)." >&2
            exit 1
          fi

          PREVIEW_FILE="$RUNNER_TEMP/app-site-previews.md"
          printf '<!-- app-site-preview-links -->\n## App-site previews\n\n' > "$PREVIEW_FILE"
          preview_count=0
          skipped_count=0

          for site in $SITES; do
            package_name=$(node -p "require('./apps/${site}/package.json').name")
            echo "Building ${site} (${package_name})"
            pnpm --filter "$package_name" build

            output_file="$RUNNER_TEMP/wrangler-${site}.log"
            set +e
            (
              cd "apps/${site}"
              pnpm exec wrangler versions upload \
                --preview-alias "$PREVIEW_ALIAS" \
                --message "PR #${{ github.event.pull_request.number }} ${COMMIT_SHA:0:7}"
            ) 2>&1 | tee "$output_file"
            upload_status=${PIPESTATUS[0]}
            set -e

            if [[ $upload_status -ne 0 ]]; then
              if grep -q "does not yet exist" "$output_file"; then
                printf -- '- **%s**: _Preview unavailable until this Worker receives its first Cloudflare deploy._\n' "$site" >> "$PREVIEW_FILE"
                skipped_count=$((skipped_count + 1))
                continue
              fi
              echo "Preview upload failed for ${site}." >&2
              exit "$upload_status"
            fi

            preview_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$output_file" | tail -1 || true)
            if [[ -z "$preview_url" ]]; then
              printf -- '- **%s**: _Version uploaded, but Preview URLs are not active on the deployed Worker yet._\n' "$site" >> "$PREVIEW_FILE"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            printf -- '- **%s**: %s\n' "$site" "$preview_url" >> "$PREVIEW_FILE"
            preview_count=$((preview_count + 1))
          done

          printf '\nUpdated from commit `%s`. %d preview(s), %d waiting for Worker/Preview activation.\n' \
            "${COMMIT_SHA:0:7}" "$preview_count" "$skipped_count" >> "$PREVIEW_FILE"
          echo "preview_file=$PREVIEW_FILE" >> "$GITHUB_OUTPUT"
          cat "$PREVIEW_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Post preview links to PR
        if: steps.deploy.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_FILE: ${{ steps.deploy.outputs.preview_file }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- app-site-preview-links -->';
            const body = fs.readFileSync(process.env.PREVIEW_FILE, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
