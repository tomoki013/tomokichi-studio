name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      # Anything that can change how *every* app is checked. Kept separate from
      # the per-app filters so that touching CI re-runs every check without also
      # redeploying every Worker.
      global: ${{ steps.filter.outputs.global }}
      main: ${{ steps.filter.outputs.main }}
      remeet: ${{ steps.filter.outputs.remeet }}
      tripory: ${{ steps.filter.outputs.tripory }}
      colorvia: ${{ steps.filter.outputs.colorvia }}
      yohaku: ${{ steps.filter.outputs.yohaku }}
      quiet-solitaire: ${{ steps.filter.outputs.quiet-solitaire }}
      review: ${{ steps.filter.outputs.review }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - '.github/workflows/**'
              - 'biome.json'
              - 'mise.toml'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            main:
              - 'apps/main/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            remeet:
              - 'apps/remeet/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            tripory:
              - 'apps/tripory/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            colorvia:
              - 'apps/colorvia/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            yohaku:
              - 'apps/yohaku/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            quiet-solitaire:
              - 'apps/quiet-solitaire/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            review:
              - 'apps/review/**'
              - 'package.json'
            api:
              - 'apps/api/**'
              - 'packages/inquiry-sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            # The contact/report platform (admin-core, admin-web, mail-ingress)
            # lives in tomoki013/inquiry-platform. Only its SDK is vendored here.

      # The Deploy workflow is chained off this run with `workflow_run`, which
      # carries no file list of its own. Hand it the one computed here so that
      # nothing is deployed without a matching green check.
      - name: Record the affected apps for the Deploy workflow
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: printf '%s' "$CHANGES" > affected-apps.json
      - uses: actions/upload-artifact@v7
        with:
          name: affected-apps
          path: affected-apps.json
          retention-days: 7

  main:
    name: Main check
    needs: changes
    if: needs.changes.outputs.main == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/main check
      - run: pnpm --filter @tomokichi/main test
      - run: pnpm --filter @tomokichi/main build
      - run: node scripts/check-seo.mjs

  remeet:
    name: Remeet check
    needs: changes
    if: needs.changes.outputs.remeet == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/remeet check
      - run: pnpm --filter @tomokichi/remeet test
      - run: pnpm --filter @tomokichi/remeet build
      - run: node scripts/check-seo.mjs

  tripory:
    name: Tripory check
    needs: changes
    if: needs.changes.outputs.tripory == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/tripory check
      - run: pnpm --filter @tomokichi/tripory test
      - run: pnpm --filter @tomokichi/tripory build
      - run: node scripts/check-seo.mjs

  colorvia:
    name: Colorvia check
    needs: changes
    if: needs.changes.outputs.colorvia == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/colorvia check
      - run: pnpm --filter @tomokichi/colorvia build
      - run: node scripts/check-seo.mjs

  yohaku:
    name: Yohaku check
    needs: changes
    if: needs.changes.outputs.yohaku == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/yohaku check
      - run: pnpm --filter @tomokichi/yohaku build
      - run: node scripts/check-seo.mjs

  quiet-solitaire:
    name: Quiet Solitaire check
    needs: changes
    if: needs.changes.outputs.quiet-solitaire == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/quiet-solitaire check
      - run: pnpm --filter @tomokichi/quiet-solitaire build
      - run: node scripts/check-seo.mjs

  review:
    name: App Review site check
    needs: changes
    if: needs.changes.outputs.review == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:review

  api:
    name: API check
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/api check
      - run: pnpm --filter @tomokichi/api test
      - run: pnpm --filter @tomokichi/api build
