name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      remeet: ${{ steps.filter.outputs.remeet }}
      tripory: ${{ steps.filter.outputs.tripory }}
      colorvia: ${{ steps.filter.outputs.colorvia }}
      yohaku: ${{ steps.filter.outputs.yohaku }}
      review: ${{ steps.filter.outputs.review }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            main:
              - 'apps/main/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            remeet:
              - 'apps/remeet/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            tripory:
              - 'apps/tripory/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            colorvia:
              - 'apps/colorvia/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            yohaku:
              - 'apps/yohaku/**'
              - 'packages/app-site/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
            review:
              - 'apps/review/**'
              - 'package.json'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'

  main:
    name: Main check
    needs: changes
    if: needs.changes.outputs.main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/main check
      - run: pnpm --filter @tomokichi/main test
      - run: pnpm --filter @tomokichi/main build
      - run: node scripts/check-seo.mjs

  remeet:
    name: Remeet check
    needs: changes
    if: needs.changes.outputs.remeet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/remeet check
      - run: pnpm --filter @tomokichi/remeet test
      - run: pnpm --filter @tomokichi/remeet build
      - run: node scripts/check-seo.mjs

  tripory:
    name: Tripory check
    needs: changes
    if: needs.changes.outputs.tripory == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/tripory check
      - run: pnpm --filter @tomokichi/tripory test
      - run: pnpm --filter @tomokichi/tripory build
      - run: node scripts/check-seo.mjs

  colorvia:
    name: Colorvia check
    needs: changes
    if: needs.changes.outputs.colorvia == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/colorvia check
      - run: pnpm --filter @tomokichi/colorvia build
      - run: node scripts/check-seo.mjs

  yohaku:
    name: Yohaku check
    needs: changes
    if: needs.changes.outputs.yohaku == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/yohaku check
      - run: pnpm --filter @tomokichi/yohaku build
      - run: node scripts/check-seo.mjs

  review:
    name: App Review site check
    needs: changes
    if: needs.changes.outputs.review == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:review

  api:
    name: API check
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tomokichi/api check
      - run: pnpm --filter @tomokichi/api test
      - run: pnpm --filter @tomokichi/api build
